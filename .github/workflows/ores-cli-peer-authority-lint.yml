name: ORES CLI peer-authority lint contract

on:
  pull_request:
    paths:
      - "contracts/ores-cli-lint/**"
      - "fixtures/ores-cli-peer-authority-pins.json"
      - "tests/ores_cli_*.test.mjs"
      - "certification/ores-cli-current-tjsv/**"
      - ".github/workflows/ores-cli-peer-authority-lint.yml"
  push:
    branches: [main]
    paths:
      - "contracts/ores-cli-lint/**"
      - "fixtures/ores-cli-peer-authority-pins.json"
      - "tests/ores_cli_*.test.mjs"
      - "certification/ores-cli-current-tjsv/**"
      - ".github/workflows/ores-cli-peer-authority-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-peer-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate exact ores-cli forward-canary mirror
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: certification/ores-cli-current-tjsv/tjsv-current-forward-canary.yml

      - name: Prove exact ores-cli #278 workflow and policy lock
        shell: bash
        run: |
          set -euo pipefail
          cert=certification/ores-cli-current-tjsv
          workflow="$cert/tjsv-current-forward-canary.yml"
          expected_blob=b7803f4f83035b1417a1e6e991409da9aed8878c
          expected_product=82ef4bae526abc64987a16485429f14a9ee04924
          expected_tjsv=c5392b03a405bb5296d1de09ac785b3b097529cd
          test "$(git hash-object "$workflow")" = "$expected_blob"
          jq -e --arg blob "$expected_blob" --arg product "$expected_product" --arg tjsv "$expected_tjsv" '
            .schema == "ores.test.source-lock/v1" and
            .repository == "ORESoftware/ores-cli" and
            .pullRequest == 278 and
            .commit == $product and
            .focus == ".github/workflows/tjsv-current-forward-canary.yml" and
            .focusBlob == $blob and
            .certificate.mode == "byte-identical-product-mirror" and
            .validator.repository == "ORESoftware/typespec-json-schema-validator" and
            .validator.revision == $tjsv and
            .validator.role == "forward-compatibility-canary-only" and
            .productionLockPolicy.mustRemainIndependent == true and
            .productionLockPolicy.mustNotBePromotedByCanary == true and
            .authorityModel.typespec == "independently-authored-first-class" and
            .authorityModel.jsonSchema == "independently-authored-draft-2020-12-first-class" and
            .authorityModel.generatedJsonSchema == "comparison-evidence-only" and
            .authorityModel.precedence == "none"
          ' "$cert/source-lock.json" >/dev/null
          grep -Fq "TJSV_CANARY_SHA: $expected_tjsv" "$workflow"
          test "$(grep -Fc "@$expected_tjsv" "$workflow")" -eq 2
          grep -Fq "test \"\$(jq -r '.revision' tjsv/source-lock.json)\" != \"\$TJSV_CANARY_SHA\"" "$workflow"

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Run independent ores-cli lint acceptance models
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/ores_cli_*.test.mjs; do
            node --check "$test_file"
          done
          node --test tests/ores_cli_*.test.mjs

      - name: Transpile TypeSpec to Schema B and compare authored Schema A
        uses: ORESoftware/typespec-json-schema-validator@c5392b03a405bb5296d1de09ac785b3b097529cd
        with:
          typespec: contracts/ores-cli-lint/main.tsp
          schema: contracts/ores-cli-lint/authored.schema.json
          report: .typespec-json-schema-validator/ores-cli-lint/report.json
          contract_ir: .typespec-json-schema-validator/ores-cli-lint/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores-cli-lint/generated
          max_probes: "64"

      - name: Verify current peer inputs and complete declaration scope
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@c5392b03a405bb5296d1de09ac785b3b097529cd
        with:
          typespec: contracts/ores-cli-lint/main.tsp
          schema: contracts/ores-cli-lint/authored.schema.json
          generated_schema: .typespec-json-schema-validator/ores-cli-lint/generated/typespec.generated.schema.json
          contract_ir: .typespec-json-schema-validator/ores-cli-lint/contract-ir.json
          report: .typespec-json-schema-validator/ores-cli-lint/report.json
          expected_declarations: '["OresCliLint.AuthorityRole","OresCliLint.WorkflowBinding"]'
          verification: .typespec-json-schema-validator/ores-cli-lint/verification.json

      - name: Prove authored authorities stayed immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/ores-cli-lint/
          git diff --check

      - name: Retain diagnostic comparison evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-cli-peer-authority-${{ github.sha }}
          path: .typespec-json-schema-validator/ores-cli-lint/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
